# Telegraf → InfluxDB. Secrets: /etc/monitoring/central/telegraf-writer.env (INFLUX_TOKEN, INFLUX_ORG, INFLUX_BUCKET).
# Requires systemd EnvironmentFile on telegraf.service.

[agent]
  interval = "20s"
  round_interval = true
  flush_interval = "10s"

[[outputs.influxdb_v2]]
  urls = ["http://127.0.0.1:8086"]
  token = "${INFLUX_TOKEN}"
  organization = "${INFLUX_ORG}"
  bucket = "${INFLUX_BUCKET}"
  timeout = "15s"

# ICMP to public DNS / anycast (raw socket; CAP_NET_RAW on telegraf.service)
[[inputs.ping]]
  urls = ["1.1.1.1", "8.8.8.8", "9.9.9.9"]
  count = 3
  ping_interval = 1.0
  timeout = 5.0

# TLS / HTTP checks (CDN paths — good proxy for “internet works”)
[[inputs.http_response]]
  urls = [
    "https://1.1.1.1",
    "https://www.cloudflare.com/cdn-cgi/trace"
  ]
  response_timeout = "12s"
  follow_redirects = false

[[inputs.net]]
  interfaces = ["eth*", "en*", "enp*", "wlan*", "ens*"]

[[inputs.diskio]]
  devices = ["nvme*", "sd*", "vd*", "xvd*"]

[[inputs.mem]]

[[inputs.cpu]]
  percpu = true
  totalcpu = true
