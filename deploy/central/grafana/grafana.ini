[paths]
provisioning = /etc/grafana/provisioning
data = /var/lib/grafana
logs = /var/log/grafana
plugins = /var/lib/grafana/plugins

[server]
http_addr = 0.0.0.0
http_port = 3000
root_url = %(protocol)s://%(domain)s:%(http_port)s/

[security]
disable_initial_admin_creation = false

[users]
allow_sign_up = false
default_theme = dark

[dashboards]
default_home_dashboard_path = /var/lib/grafana/dashboards/monitoring-fleet-overview.json
